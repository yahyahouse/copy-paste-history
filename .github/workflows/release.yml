name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis yang mau diisi DMG (contoh: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: |
          chmod +x build.sh make-dmg.sh
          if ! ./make-dmg.sh "${TAG#v}" > build.log 2>&1; then
            cat build.log
            tail -n 25 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build.log

      - name: Upload to release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ClipHistory $TAG" --generate-notes
          gh release upload "$TAG" ClipHistory-*.dmg --clobber
