name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis (contoh: v1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::SIGNING_CERT_P12 belum diisi, pakai ad-hoc signing"
            exit 0
          fi
          echo "$CERT_P12" | base64 --decode > cert.p12
          openssl pkcs12 -in cert.p12 -passin env:CERT_PASSWORD -nokeys -out cert.pem
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem
          rm -f cert.p12 cert.pem
          echo "SIGN_ID=ClipHistory Signing" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          chmod +x build.sh make-dmg.sh
          if ! ./make-dmg.sh "${TAG#v}" > build.log 2>&1; then
            cat build.log
            tail -n 25 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build.log
          grep "designated" build.log | while IFS= read -r line; do echo "::notice::$line"; done

      - name: Upload to release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Clip History $TAG" --generate-notes
          gh release upload "$TAG" ClipHistory-*.dmg --clobber

      - name: Checksum
        id: sum
        run: echo "sha256=$(shasum -a 256 ClipHistory-*.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  homebrew:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SHA: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update cask
        run: |
          VERSION="${TAG#v}"
          sed -i -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                 -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/clip-history.rb
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update cask to $VERSION"
          git push origin main
